<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1a1a1a" />
    <!--
      THE MANIFEST IS REQUIRED, and display:fullscreen inside it is the only
      thing measured to give this app the full 874pt screen.

      Three configurations have now been tested on the device, all with the
      Apple meta tags below present and unchanged:

        manifest display:standalone   -> innerHeight 812  (62 short)
        NO manifest link at all       -> innerHeight 812  (62 short)
        manifest display:fullscreen   -> innerHeight 874  (full screen)

      The middle row is the one that settles it. With no manifest, iOS had
      nothing but apple-mobile-web-app-status-bar-style: black-translucent to
      go on, and it STILL inset the window by 62 -- so that meta tag no longer
      controls the window height. Apple deprecated it in favour of the
      manifest, and this device behaves accordingly. The tags stay because they
      still supply the app title and the standalone launch; they are simply not
      the lever for height.

      Do not remove this link again, and do not change display away from
      fullscreen, without re-measuring innerHeight against screen.height in the
      Settings VIEWPORT panel.
    -->
    <link rel="manifest" href="/aldebaran-notebook/manifest.json" />
    <link rel="icon" href="/aldebaran-notebook/icon-192.png" />
    <link rel="apple-touch-icon" href="/aldebaran-notebook/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Notebook" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <title>Notebook</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { height: 100%; background: #1a1a1a; }
      body {
        color: #e8e8e8;
        font-family: 'DM Mono', 'Courier New', monospace;
        -webkit-tap-highlight-color: transparent;
        -webkit-font-smoothing: antialiased;
      }
      #root { height: 100%; }
      ::-webkit-scrollbar { width: 4px; height: 4px; }
      ::-webkit-scrollbar-track { background: #1a1a1a; }
      ::-webkit-scrollbar-thumb { background: #444; border-radius: 2px; }
      input, select, textarea, button { font-family: inherit; font-size: 16px; }
      textarea { field-sizing: content; }
    </style>
    <script type="module" crossorigin src="/aldebaran-notebook/assets/index-BQvtvxts.js"></script>
  </head>

    <div id="root"></div>
  </body>
