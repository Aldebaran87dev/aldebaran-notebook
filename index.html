    <!--
      NO MANIFEST LINK, deliberately. This is the whole fix for the 62pt strip.

      iOS has two config paths for a home-screen web app: the Apple meta tags
      below, and a web app manifest. When a manifest declares `display`, iOS
      follows THAT and ignores apple-mobile-web-app-status-bar-style -- and
      `standalone` is the mode that insets the web view 62pt below the status
      bar, which is where the strip came from.

      MEASURED, and this is what identified it: at 8:19, immediately after a
      fresh Add to Home Screen, innerHeight was 874 with the status bar VISIBLE
      -- which is black-translucent behaviour, not fullscreen (fullscreen hides
      the status bar). By 8:40 the same install reported 812. iOS had fetched
      the manifest asynchronously, and once it had it, the manifest's display
      won and the window shrank. Nothing in the code changed between those two
      readings.

      Removing the link leaves only the meta path, which is the one that
      produced 874. Everything the manifest supplied has an Apple equivalent
      already present: capable, status-bar-style, title, and apple-touch-icon.
      public/manifest.json is left in place but unreferenced.

      Cost: no installable PWA on Android or desktop. This app is used on one
      iPhone. Restore the link if that ever changes, and expect the strip back.
    -->
    <!-- <link rel="manifest" href="/manifest.json" /> -->
    <link rel="icon" href="/aldebaran-notebook/icon-192.png" />
    <link rel="apple-touch-icon" href="/aldebaran-notebook/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Notebook" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <title>Notebook</title>
    <style>

      html, body { height: 100%; background: #1a1a1a; }
      body {
        color: #e8e8e8;
        font-family: 'DM Mono', 'Courier New', monospace;
        -webkit-tap-highlight-color: transparent;
        -webkit-font-smoothing: antialiased;
      }
      #root { height: 100%; }
